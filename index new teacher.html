<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劍聲幼教｜新人入職引導系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =====================================================
   DESIGN TOKENS
   ===================================================== */
:root {
  --coral:       #FF6B5B;
  --coral-lt:    #FFF0EE;
  --coral-dk:    #D94F3F;
  --sky:         #4DC4D5;
  --sky-lt:      #E6F7FA;
  --sky-dk:      #2FA8BA;
  --cream:       #FBF8F3;
  --white:       #FFFFFF;
  --txt:         #2A2A2A;
  --txt-mid:     #606060;
  --txt-lt:      #9A9A9A;
  --yellow:      #FFD166;
  --q-red:       #EF476F;
  --q-blue:      #118AB2;
  --q-yellow:    #FFB703;
  --q-green:     #06D6A0;
  --shadow-sm:   0 2px 10px rgba(0,0,0,.06);
  --shadow:      0 4px 24px rgba(0,0,0,.09);
  --shadow-lg:   0 8px 40px rgba(0,0,0,.13);
  --r:           16px;
  --r-lg:        24px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans TC', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--txt);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* =====================================================
   HEADER
   ===================================================== */
#main-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 28px;
  background: rgba(251,248,243,.93);
  backdrop-filter: blur(12px);
  border-bottom: 1.5px solid rgba(255,107,91,.12);
  transition: opacity .3s, transform .3s;
}
#main-header.hidden { opacity: 0; pointer-events: none; transform: translateY(-100%); }

.header-logo {
  font-weight: 900; font-size: .95rem;
  color: var(--coral); letter-spacing: .06em;
  display: flex; align-items: center; gap: 6px;
}

#progress-dots { display: flex; gap: 6px; align-items: center; }

.pdot-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pdot-label { font-size: .55rem; color: var(--txt-lt); white-space: nowrap; }

.pdot {
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid var(--coral);
  background: transparent;
  transition: all .3s;
  position: relative; cursor: default;
}
.pdot.done { background: var(--coral); }
.pdot.done::after {
  content: '✓';
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: 7px; color: #fff; font-weight: 700;
}
.pdot.current {
  background: var(--coral);
  transform: scale(1.35);
  box-shadow: 0 0 0 3px rgba(255,107,91,.3);
}

#score-display {
  font-weight: 700; font-size: .9rem;
  color: var(--coral-dk);
  background: var(--coral-lt);
  padding: 5px 14px; border-radius: 20px;
  transition: all .3s;
}
.score-bump { animation: scorePop .45s ease; }
@keyframes scorePop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.25); color: var(--coral-dk); }
  100% { transform: scale(1); }
}

/* =====================================================
   MAIN LAYOUT
   ===================================================== */
#app-main {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
}
#app-main.with-header { padding-top: 62px; }

.screen-inner {
  width: 100%; max-width: 860px;
  padding: 36px 24px 72px;
  animation: fadeUp .45s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =====================================================
   BUTTONS
   ===================================================== */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 28px; border-radius: 50px;
  font-family: inherit; font-size: 1rem; font-weight: 700;
  cursor: pointer; border: none; transition: all .2s;
  text-decoration: none; line-height: 1;
}
.btn:active { transform: scale(.97); }
.btn-primary {
  background: var(--coral); color: #fff;
  box-shadow: 0 4px 16px rgba(255,107,91,.42);
}
.btn-primary:hover { background: var(--coral-dk); transform: translateY(-1px); }
.btn-secondary {
  background: var(--sky); color: #fff;
  box-shadow: 0 4px 16px rgba(77,196,213,.38);
}
.btn-secondary:hover { background: var(--sky-dk); transform: translateY(-1px); }
.btn:disabled { opacity: .38; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* =====================================================
   CARDS
   ===================================================== */
.card {
  background: var(--white);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 24px;
}

/* =====================================================
   FORM
   ===================================================== */
.form-group { margin-bottom: 20px; }
.form-label {
  display: block; font-weight: 700; font-size: .88rem;
  color: var(--txt-mid); margin-bottom: 7px;
}
.form-input, .form-select {
  width: 100%; padding: 12px 16px;
  border: 2px solid #EAE5DF; border-radius: 12px;
  font-family: inherit; font-size: 1rem; color: var(--txt);
  background: #fff; transition: border-color .2s; outline: none;
  appearance: none;
}
.form-input:focus, .form-select:focus { border-color: var(--coral); }

/* =====================================================
   MASCOT SVG ART
   ===================================================== */
.mascot-svg { display: block; }

/* Floating animation */
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
@keyframes floatDelay {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-10px); }
}
.float-anim  { animation: float 3s ease-in-out infinite; }
.float-anim2 { animation: float 3s ease-in-out infinite; animation-delay: .6s; }

/* Mascot slide-in from sides */
@keyframes slideFromLeft {
  from { opacity: 0; transform: translateX(-60px) scale(.8); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes slideFromRight {
  from { opacity: 0; transform: translateX(60px) scale(.8); }
  to   { opacity: 1; transform: translateX(0) scale(1); }
}
.slide-left  { animation: slideFromLeft  .55s cubic-bezier(.34,1.56,.64,1); }
.slide-right { animation: slideFromRight .55s cubic-bezier(.34,1.56,.64,1); }

/* =====================================================
   SPEECH BUBBLE
   ===================================================== */
.mascot-row {
  display: flex; align-items: flex-start; gap: 16px;
  margin-bottom: 28px;
}
.mascot-row.reverse { flex-direction: row-reverse; }

.mascot-col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
.mascot-name-tag {
  font-size: .7rem; font-weight: 700; color: var(--txt-mid);
  background: var(--white); padding: 2px 10px; border-radius: 20px;
  box-shadow: var(--shadow-sm);
}

.speech-bubble {
  background: var(--white); border-radius: var(--r); padding: 16px 20px;
  box-shadow: var(--shadow-sm); font-size: 1.05rem; line-height: 1.75;
  flex: 1; position: relative;
}
.mascot-row:not(.reverse) .speech-bubble::before {
  content: ''; position: absolute;
  left: -9px; top: 22px;
  border: 9px solid transparent; border-right-color: var(--white); border-left: 0;
  filter: drop-shadow(-2px 0 2px rgba(0,0,0,.04));
}
.mascot-row.reverse .speech-bubble::after {
  content: ''; position: absolute;
  right: -9px; top: 22px;
  border: 9px solid transparent; border-left-color: var(--white); border-right: 0;
}

/* =====================================================
   STATION HEADER
   ===================================================== */
.station-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, var(--coral), var(--coral-dk));
  color: #fff; padding: 5px 16px; border-radius: 20px;
  font-weight: 700; font-size: .88rem; margin-bottom: 10px;
}
.station-title {
  font-size: 1.75rem; font-weight: 900; line-height: 1.3;
  margin-bottom: 28px;
}

/* =====================================================
   VIDEO
   ===================================================== */
.video-wrap {
  background: #111; border-radius: var(--r); overflow: hidden;
  aspect-ratio: 16/9; margin: 20px 0;
  box-shadow: var(--shadow-lg);
}
.video-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

.video-lock-bar {
  display: flex; align-items: center; gap: 12px;
  background: var(--white); border-radius: 12px;
  padding: 14px 20px; box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}
.video-lock-bar .lock-icon { font-size: 1.3rem; flex-shrink: 0; }
.video-lock-bar .lock-text { flex: 1; font-size: .9rem; color: var(--txt-mid); }
.lock-text strong { color: var(--coral); }

.progress-bar-wrap {
  height: 8px; background: #EEE; border-radius: 4px;
  flex: 1; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: var(--coral);
  border-radius: 4px; transition: width 1s linear; width: 0%;
}

/* =====================================================
   ORG CHART
   ===================================================== */
.org-wrap { overflow-x: auto; padding: 10px 0 20px; }
.org-tree { display: flex; flex-direction: column; align-items: center; }

.org-node { display: flex; flex-direction: column; align-items: center; }
.org-vline { width: 2px; height: 28px; background: #DDD; }
.org-level { display: flex; gap: 20px; position: relative; }
.org-level::before {
  content: ''; position: absolute;
  top: 0; height: 2px; background: #DDD;
  left: calc(50% - var(--span-half, 50%) ); right: 0;
}

.org-branch { display: flex; flex-direction: column; align-items: center; }
.org-branch-vline { width: 2px; height: 24px; background: #DDD; }

.org-card {
  background: var(--white);
  border: 2px solid var(--coral-lt);
  border-radius: 14px;
  padding: 12px 18px;
  text-align: center;
  min-width: 115px;
  box-shadow: var(--shadow-sm);
  transition: transform .2s;
}
.org-card:hover { transform: translateY(-2px); }
.org-card.root { border-color: var(--coral); background: var(--coral-lt); }
.org-card.dir  { border-color: var(--sky); background: var(--sky-lt); }

.org-avatar {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 1.1rem; color: #fff;
  margin: 0 auto 8px;
}
.org-photo-wrap {
  width: 52px; height: 52px; border-radius: 50%;
  overflow: hidden; margin: 0 auto 8px;
  border: 2px solid rgba(255,255,255,.6);
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.org-photo {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.org-role  { font-size: .7rem; color: var(--txt-lt); margin-bottom: 2px; }
.org-name  { font-weight: 700; font-size: .88rem; }

/* =====================================================
   TIMELINE
   ===================================================== */
.timeline { position: relative; padding-left: 82px; }
.timeline::before {
  content: ''; position: absolute;
  left: 44px; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(to bottom, var(--coral-lt), var(--sky-lt));
  border-radius: 2px;
}
.tl-item {
  position: relative; padding: 10px 0 10px 22px;
  display: flex; align-items: flex-start;
}
.tl-dot {
  position: absolute; left: -19px; top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--coral); border: 3px solid var(--white);
  box-shadow: var(--shadow-sm);
}
.tl-time {
  position: absolute; right: calc(100% + 28px); top: 50%;
  transform: translateY(-50%);
  font-weight: 700; font-size: .76rem; color: var(--coral-dk);
  white-space: nowrap; text-align: right; width: 44px;
}
.tl-content {
  background: var(--white); border-radius: 12px;
  padding: 10px 16px; box-shadow: var(--shadow-sm); flex: 1;
}
.tl-content h4 { font-weight: 700; font-size: .9rem; margin-bottom: 2px; }
.tl-content p  { font-size: .82rem; color: var(--txt-lt); }

/* =====================================================
   RULES
   ===================================================== */
.rules-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}
.rules-card {
  background: var(--white); border-radius: var(--r);
  padding: 20px; box-shadow: var(--shadow-sm);
}
.rules-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.rules-icon-wrap {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
}
.rules-card-title { font-weight: 700; font-size: .95rem; }
.rules-list { list-style: none; }
.rules-list li {
  font-size: .84rem; color: var(--txt-mid);
  padding: 5px 0 5px 16px; position: relative;
  border-bottom: 1px solid #F3EFE9;
}
.rules-list li:last-child { border-bottom: none; }
.rules-list li::before {
  content: '•'; position: absolute; left: 0;
  color: var(--coral); font-weight: 700;
}

/* =====================================================
   STAFF ACCORDION
   ===================================================== */
.staff-list { display: flex; flex-direction: column; gap: 12px; }
.staff-card {
  background: var(--white); border-radius: var(--r);
  box-shadow: var(--shadow-sm); overflow: hidden;
}
.staff-head {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 20px; cursor: pointer;
  transition: background .15s;
}
.staff-head:hover { background: #FAFAF8; }
.staff-av {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 1.15rem; color: #fff; flex-shrink: 0;
}
.staff-info h4 { font-weight: 700; font-size: 1rem; }
.staff-info p  { font-size: .84rem; color: var(--txt-lt); }
.staff-badge {
  display: inline-block; background: var(--sky-lt); color: var(--sky-dk);
  font-size: .72rem; font-weight: 700; padding: 2px 9px; border-radius: 10px;
  margin-left: 7px;
}
.staff-chevron {
  margin-left: auto; color: var(--txt-lt);
  transition: transform .3s; font-size: 1.1rem;
}
.staff-card.open .staff-chevron { transform: rotate(180deg); }
.staff-video-panel { display: none; padding: 0 20px 20px; }
.staff-card.open .staff-video-panel { display: block; animation: fadeUp .3s ease; }
.staff-watched-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: #E8FAF3; color: #16845A;
  font-size: .75rem; font-weight: 700;
  padding: 2px 10px; border-radius: 10px; margin-left: 8px;
}

/* =====================================================
   MONTESSORI CARDS
   ===================================================== */
.monte-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 14px;
  margin-top: 20px;
}
.monte-card {
  background: var(--white); border-radius: var(--r);
  padding: 18px 14px; text-align: center;
  box-shadow: var(--shadow-sm); transition: transform .2s;
  animation: fadeUp .4s ease backwards;
}
.monte-card:hover { transform: translateY(-3px); }
.monte-icon { font-size: 2rem; margin-bottom: 8px; }
.monte-name { font-weight: 700; font-size: .88rem; margin-bottom: 4px; }
.monte-desc { font-size: .78rem; color: var(--txt-lt); line-height: 1.45; }

/* =====================================================
   BIHENG FEATURE CARDS
   ===================================================== */
.biheng-cards {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-top: 20px;
}
.biheng-card {
  background: var(--white); border-radius: var(--r);
  padding: 20px 16px; text-align: center; box-shadow: var(--shadow-sm);
}
.biheng-icon { font-size: 2.2rem; margin-bottom: 10px; }
.biheng-card h4 { font-weight: 700; margin-bottom: 6px; font-size: .95rem; }
.biheng-card p  { font-size: .82rem; color: var(--txt-lt); line-height: 1.5; }

/* =====================================================
   QUIZ
   ===================================================== */
.quiz-zone { max-width: 720px; margin: 0 auto; }

.quiz-top {
  text-align: center; margin-bottom: 28px;
}
.quiz-badge {
  display: inline-block;
  background: var(--yellow); color: #7A5800;
  font-weight: 700; font-size: .85rem;
  padding: 4px 16px; border-radius: 20px; margin-bottom: 10px;
}
.quiz-qnum {
  font-size: .88rem; color: var(--txt-lt); margin-bottom: 10px;
}
.quiz-q {
  font-size: 1.55rem; font-weight: 900; line-height: 1.45;
}

.quiz-opts {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  margin: 30px 0;
}
.qopt {
  border: none; border-radius: var(--r); padding: 20px 16px;
  font-family: inherit; font-size: 1rem; font-weight: 700;
  color: #fff; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  text-align: left; transition: all .2s;
  min-height: 72px;
}
.qopt:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-2px); }
.qopt:active:not(:disabled) { transform: translateY(0); }
.qopt:disabled { cursor: default; }
.qopt.c0 { background: var(--q-red);    box-shadow: 0 4px 16px rgba(239,71,111,.38); }
.qopt.c1 { background: var(--q-blue);   box-shadow: 0 4px 16px rgba(17,138,178,.38); }
.qopt.c2 { background: var(--q-yellow); color: #5A3800; box-shadow: 0 4px 16px rgba(255,183,3,.38); }
.qopt.c3 { background: var(--q-green);  box-shadow: 0 4px 16px rgba(6,214,160,.38); }

.qopt.state-correct {
  background: #06D6A0 !important; color: #fff !important;
  box-shadow: 0 4px 20px rgba(6,214,160,.55) !important;
  transform: scale(1.02);
}
.qopt.state-wrong-sel {
  background: #EF476F !important; color: #fff !important;
  box-shadow: 0 4px 20px rgba(239,71,111,.45) !important;
}
.qopt.state-dim {
  background: #E8E8E8 !important; color: #AAA !important;
  box-shadow: none !important; transform: scale(.97);
}

.opt-icon {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,.28);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}

.quiz-result-box {
  background: var(--white); border-radius: var(--r);
  padding: 18px 22px; box-shadow: var(--shadow-sm);
  border-left: 4px solid var(--sky);
  font-size: .96rem; line-height: 1.75;
  animation: fadeUp .35s ease;
  margin-bottom: 16px;
}
.quiz-actions {
  display: flex; justify-content: flex-end;
}

/* =====================================================
   MASCOT POPUP
   ===================================================== */
#mascot-popup {
  position: fixed; bottom: 28px; right: 28px; z-index: 300;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  opacity: 0; transform: translateY(20px) scale(.8);
  transition: all .4s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
}
#mascot-popup.show {
  opacity: 1; transform: translateY(0) scale(1);
}
.popup-bubble {
  background: var(--white); border-radius: 16px;
  padding: 11px 16px; box-shadow: var(--shadow-lg);
  font-weight: 700; font-size: .92rem; max-width: 190px;
  text-align: center; line-height: 1.4;
}
#popup-mascot-svg { width: 72px; height: 86px; }

@keyframes popJump {
  0%,100% { transform: translateY(0); }
  35%      { transform: translateY(-16px); }
  65%      { transform: translateY(-7px); }
}
#mascot-popup.show #popup-mascot-svg {
  animation: popJump .65s ease;
}

/* =====================================================
   WELCOME SCREEN
   ===================================================== */
.welcome-center {
  min-height: calc(100vh - 62px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px; max-width: 700px; margin: 0 auto; width: 100%;
}
.welcome-mascots-row {
  display: flex; gap: 48px; justify-content: center;
  margin-bottom: 36px;
}
.welcome-mascot-col {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.welcome-mascot-col svg { width: 116px; height: 140px; }
.welcome-mascot-label {
  font-weight: 700; font-size: .88rem; color: var(--txt-mid);
}
.welcome-bubble {
  background: var(--white); border-radius: var(--r-lg);
  padding: 26px 32px; box-shadow: var(--shadow);
  font-size: 1.05rem; line-height: 1.85; text-align: center;
  min-height: 80px; width: 100%;
}
#tw-cursor {
  display: inline-block; width: 2px; height: 1.1em;
  background: var(--coral); margin-left: 1px;
  animation: blinkC .7s step-end infinite;
  vertical-align: text-bottom;
}
@keyframes blinkC { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

/* =====================================================
   SCREEN 0
   ===================================================== */
.s0-wrap {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.s0-inner { width: 100%; max-width: 480px; }
.s0-logo {
  text-align: center; font-size: 2.2rem; font-weight: 900;
  color: var(--coral); margin-bottom: 6px;
}
.s0-sub {
  text-align: center; color: var(--txt-mid); font-size: 1rem;
  margin-bottom: 28px;
}
.s0-mascots {
  display: flex; justify-content: center; gap: 20px;
  margin-bottom: 28px;
}
.s0-mascots svg { width: 76px; height: 92px; }

/* =====================================================
   COMPLETION SCREEN
   ===================================================== */
.completion-center {
  text-align: center; max-width: 700px; margin: 0 auto;
  padding: 36px 24px 80px; width: 100%;
}
.completion-mascots {
  display: flex; justify-content: center; gap: 36px; margin-bottom: 32px;
}
.completion-mascots svg { width: 100px; height: 120px; }
.final-score {

/* ============================================================
   HEADER & PROGRESS
   ============================================================ */
const STATION_LABELS = ['環境','組織','同事','流程','規章','歷史','教學','必亨'];

function updateHeader(screenNum) {
  const hdr = document.getElementById('main-header');
  if (screenNum === 0) { hdr.classList.add('hidden'); return; }
  hdr.classList.remove('hidden');

  // Progress dots
  const container = document.getElementById('progress-dots');
  container.innerHTML = '';
  const currentStation = screenNum >= 18 ? 9 : Math.ceil((screenNum - 1) / 2);

  for (let i = 1; i <= 8; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'pdot-wrap';
    const dot = document.createElement('div');
    dot.className = 'pdot';
    if (i < currentStation) dot.classList.add('done');
    else if (i === currentStation) dot.classList.add('current');
    const lbl = document.createElement('div');
    lbl.className = 'pdot-label';
    lbl.textContent = STATION_LABELS[i-1];
    wrap.appendChild(dot);
    wrap.appendChild(lbl);
    container.appendChild(wrap);
  }

  document.getElementById('score-val').textContent = S.score;
}

function addScore(pts) {
  S.score += pts;
  const el = document.getElementById('score-val');
  el.textContent = S.score;
  const disp = document.getElementById('score-display');
  disp.classList.remove('score-bump');
  void disp.offsetWidth;
  disp.classList.add('score-bump');
}

/* ============================================================
   MASCOT POPUP
   ============================================================ */
let popupTimer = null;
function showPopup(who, msg) {
  clearTimeout(popupTimer);
  const pop = document.getElementById('mascot-popup');
  document.getElementById('popup-text').textContent = msg;
  const svg = document.getElementById('popup-mascot-svg');
  svg.innerHTML = (who === 'binbin' ? binbinSVG(72, 86) : yueyueSVG(72, 86));
  svg.setAttribute('viewBox', '0 0 100 120');
  pop.classList.remove('show');
  void pop.offsetWidth;
  pop.classList.add('show');
  popupTimer = setTimeout(() => pop.classList.remove('show'), 3000);
}

/* ============================================================
   TYPEWRITER
   ============================================================ */
function typewrite(elementId, text, onDone, speed = 38) {
  const el = document.getElementById(elementId);
  if (!el) return;
  el.innerHTML = '';
  let i = 0;
  const cursor = document.createElement('span');
  cursor.id = 'tw-cursor';
  el.appendChild(cursor);
  const iv = setInterval(() => {
    if (i >= text.length) {
      clearInterval(iv);
      cursor.remove();
      if (onDone) onDone();
      return;
    }
    el.insertBefore(document.createTextNode(text[i]), cursor);
    i++;
  }, speed);
}

/* ============================================================
   VIDEO TIMER
   ============================================================ */
function startVideoTimer(nextScreen, timerBarId, lockAreaId, btnWrapperId) {
  clearInterval(S.videoTimerID);
  S.videoElapsed  = 0;
  S.videoUnlocked = false;

  const bar   = document.getElementById(timerBarId);
  const lock  = document.getElementById(lockAreaId);
  const btnW  = document.getElementById(btnWrapperId);
  if (btnW) btnW.style.display = 'none';

  S.videoTimerID = setInterval(() => {
    S.videoElapsed++;
    const pct = Math.min(100, (S.videoElapsed / 30) * 100);
    if (bar) bar.style.width = pct + '%';
    if (S.videoElapsed >= 30 && !S.videoUnlocked) {
      S.videoUnlocked = true;
      clearInterval(S.videoTimerID);
      if (lock)  lock.style.display = 'none';
      if (btnW) {
        btnW.style.display = 'flex';
        btnW.style.animation = 'fadeUp .45s ease';
      }
    }
  }, 1000);
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function go(n) {
  clearInterval(S.videoTimerID);
  S.screen = n;
  const main = document.getElementById('app-main');
  main.className = n === 0 ? '' : 'with-header';
  main.innerHTML = renderScreen(n);
  updateHeader(n);
  window.scrollTo(0, 0);
  initScreen(n);
}

/* ============================================================
   ORG CHART RENDERER
   ============================================================ */
function renderOrgNode(node, depth=0) {
  const initial = node.name.charAt(0);
  // 有 photo 屬性時顯示圖片，圖片載入失敗時自動 fallback 到文字頭像
  const avatarHtml = node.photo ? `
    <div class="org-photo-wrap">
      <img src="${node.photo}" class="org-photo" alt="${node.name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="org-avatar" style="background:${node.avatarBg};display:none">${initial}</div>
    </div>` :
    `<div class="org-avatar" style="background:${node.avatarBg}">${initial}</div>`;

  return `
    <div class="org-branch">
      <div class="org-card ${node.colorClass||''}">
        ${avatarHtml}
        <div class="org-role">${node.title}</div>
        <div class="org-name">${node.name}</div>
      </div>
      ${node.children && node.children.length ? `
        <div class="org-branch-vline"></div>
        <div class="org-level" style="gap:${depth>0?'14px':'20px'}">
          ${node.children.map(c => renderOrgNode(c, depth+1)).join('')}
        </div>
      ` : ''}
    </div>`;
}

  const icons = ['🔴','🔵','🟡','🟢'];
  const optBtns = q.opts.map((opt, i) => `
    <button class="qopt c${i}" id="qo${i}" onclick="handleAnswer(${i})"
            ${S.qAnswered !== null ? 'disabled' : ''}>
      <span class="opt-icon">${icons[i]}</span>
      <span>${opt}</span>
    </button>`).join('');

  const resultHtml = S.qAnswered !== null ? `
    <div class="quiz-result-box">${q.exp}</div>
    <div class="quiz-actions">
      ${S.qIdx < quiz.questions.length - 1
        ? `<button class="btn btn-primary" onclick="nextQQ()">下一題 →</button>`
        : `<button class="btn btn-primary" onclick="go(${S.qStation*2+4})">繼續引導 →</button>`}
    </div>` : '';

  return `
  <div class="screen-inner">
    <div class="quiz-zone">
      <div class="quiz-top">
        <div class="quiz-badge">🎮 第 ${S.qStation+1} 關搶答・${quiz.name}</div>
        <div class="quiz-qnum">第 ${S.qIdx+1} 題 / 共 ${quiz.questions.length} 題</div>
        <div class="quiz-q">${q.q}</div>
      </div>
      <div class="quiz-opts">${optBtns}</div>
      <div id="quiz-feedback">${resultHtml}</div>
    </div>
  </div>`;
}

function handleAnswer(sel) {
  if (S.qAnswered !== null) return;
  S.qAnswered = sel;
  const q = CONFIG.quizzes[S.qStation].questions[S.qIdx];
  const isCorrect = sel === q.ans;

  if (isCorrect) {
    addScore(100);
    showPopup('binbin', '答對了！好厲害！');
  } else {
    showPopup('yueyue', '沒關係，記住了就好！');
  }

  // Update button styles
  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById('qo' + i);
    if (!btn) continue;
    btn.disabled = true;
    if (i === q.ans) {
      btn.className = 'qopt state-correct';
      btn.querySelector('span:last-child').textContent = '✓ ' + q.opts[i];
    } else if (i === sel && !isCorrect) {
      btn.className = 'qopt state-wrong-sel';
      btn.querySelector('span:last-child').textContent = '✗ ' + q.opts[i];
    } else {
      btn.className = 'qopt state-dim';
    }
  }

  // Show explanation
  const fb = document.getElementById('quiz-feedback');
  const quiz = CONFIG.quizzes[S.qStation];
  fb.innerHTML = `
    <div class="quiz-result-box">${q.exp}</div>
    <div class="quiz-actions">
      ${S.qIdx < quiz.questions.length - 1
        ? `<button class="btn btn-primary" onclick="nextQQ()">下一題 →</button>`
        : `<button class="btn btn-primary" onclick="go(${S.qStation*2+4})">繼續引導 →</button>`}
    </div>`;
  fb.style.animation = 'fadeUp .35s ease';
}

function nextQQ() {
  S.qIdx++;
  S.qAnswered = null;
  const main = document.getElementById('app-main');
  main.innerHTML = renderQuizQuestion();
}

/* ── Screen 18: 完成 ── */
function renderS18() {
  const dateStr = S.joinDate
    ? new Date(S.joinDate).toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric'})
    : new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric'});

  return `
  <div class="with-header" style="width:100%">
  <div class="completion-center">
    <div class="completion-mascots">
      <div class="float-anim">${binbinSVG(100,120)}</div>
      <div class="float-anim2">${yueyueSVG(100,120)}</div>
    </div>
    <div style="font-size:1rem;color:var(--txt-mid);margin-bottom:4px">🎉 恭喜完成所有關卡！</div>
    <div class="final-score">${S.score} <span style="font-size:1.4rem;color:var(--txt-lt)">分</span></div>
    <div class="final-score-sub">滿分 1600 分</div>
    <div class="final-msg" id="final-tw"></div>
    <div class="final-meta">
      入職日期：${dateStr}　｜　服務單位：${S.unit}
    </div>
    <div class="print-btn-row">
      <button class="btn btn-primary" onclick="window.print()">🖨️ 列印記錄</button>
      <button class="btn btn-secondary" onclick="savePDF()">💾 儲存 PDF</button>
    </div>
  </div>
  </div>`;
}

function initS18() {
  const msg = `${S.name}老師，你已經完成了劍聲的入職引導！從今天起，你是我們的夥伴了。有任何問題，你的導師和組長隨時都在。加油，我們一起為孩子創造美好的每一天！`;
  typewrite('final-tw', msg, () => {
    launchConfetti();
  });
}

function savePDF() {
  window.print();
}

/* ============================================================
   INIT SCREEN (event hooks after render)
   ============================================================ */
function initScreen(n) {
  switch(n) {
    case 1:  initS1(); break;
    case 2:  initVideoTimer(3);  break;
    case 8:  initVideoTimer(9);  break;
    case 12: initVideoTimer(13); break;
    case 14: initVideoTimer(15); break;
    case 16: initVideoTimer(17); break;
    case 18: initS18(); break;
  }
}

/* ============================================================
   CONFETTI
   ============================================================ */
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#FF6B5B','#4DC4D5','#FFD166','#06D6A0','#FF8FAB','#9B8EC4'];
  const pieces = Array.from({length: 160}, () => ({
    x:   Math.random() * canvas.width,
    y:   Math.random() * canvas.height - canvas.height,
    r:   Math.random() * 7 + 4,
    d:   Math.random() * 160 + 80,
    color: colors[Math.floor(Math.random() * colors.length)],
    tilt: Math.random() * 10 - 5,
    tiltAngle: 0,
    tiltSpeed: Math.random() * 0.1 + 0.05,
    vx: Math.random() * 2 - 1,
    vy: Math.random() * 2 + 1.5
  }));

  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frame++;
    pieces.forEach(p => {
      p.tiltAngle += p.tiltSpeed;
      p.y += p.vy;
      p.x += p.vx + Math.sin(frame * 0.01 + p.d) * 0.5;
      p.tilt = Math.sin(p.tiltAngle) * 12;
      ctx.beginPath();
      ctx.lineWidth = p.r / 2;
      ctx.strokeStyle = p.color;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = .85;
      ctx.moveTo(p.x + p.tilt + p.r / 4, p.y);
      ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r * 1.2);
      ctx.stroke();
      if (p.y > canvas.height + 20) {
        p.y = -10; p.x = Math.random() * canvas.width;
      }
    });
    ctx.globalAlpha = 1;
    if (frame < 360) requestAnimationFrame(draw);
    else { ctx.clearRect(0,0,canvas.width,canvas.height); canvas.style.display='none'; }
  }
  draw();
}

/* ============================================================
   BOOT

go(0);
